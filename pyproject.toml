[project]
name = "ai-attestation"
version = "0.1.0"
description = "Open-source AI API audit proxy with tamper-proof evidence chain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-attestation contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["backend/app"]
testpaths = ["backend/tests"]
